spring.application.name=movrit

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/movrit
spring.datasource.username=movrit_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000

# Password reset
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/password/reset}
# 로컬 개발에서는 테스트 편의를 위해 응답에 토큰을 노출한다. 운영에서는 반드시 false.
app.password-reset.expose-token=${PASSWORD_RESET_EXPOSE_TOKEN:true}
app.mail.enabled=${MAIL_ENABLED:false}

# SMTP (MAIL_ENABLED=true 일 때 사용)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Kakao Login
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.redirect-uri=http://localhost:8080/api/auth/kakao/callback

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=http://localhost:8080/api/auth/google/callback

# Local image storage (development)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 예상 정산액에 사용하는 기본 플랫폼 수수료율
movrit.settlement.default-fee-rate=10
