spring.application.name=movrit

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/movrit
spring.datasource.username=movrit_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
# DB 구조 변경은 Flyway 버전 파일(db/migration/V*.sql)로만 합니다. 절차: docs/db-migration.md
# 기존 DB는 처음 실행 시 기준선 1로 기록하고 V2부터 적용합니다. 과거 실험용 flyway_schema_history와 겹치지 않도록 별도 이력 테이블을 씁니다.
spring.flyway.enabled=true
spring.flyway.table=movrit_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline_2026_10_31
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000

# Kakao Login
kakao.client-id=${KAKAO_CLIENT_ID}
# Client Secret을 사용하지 않는 Kakao 앱은 값을 비워 둘 수 있습니다(비어 있으면 토큰 요청에서 제외).
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# Google과 같이 환경변수로 콜백 주소를 바꿀 수 있게 합니다. Kakao Developers에 같은 주소를 등록해야 합니다.
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
# API를 부를 수 있고 로그인 토큰을 넘겨받을 수 있는 프론트 주소(쉼표로 구분). 배포할 때는 실제 도메인만 적습니다. '*'는 쓸 수 없습니다.
movrit.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# SNS 채널 계정 연결(인스타그램·유튜브·네이버 블로그)
# 로그인 연결은 나중에 켭니다. 꺼져 있으면 '직접 등록 → 운영자 확인'만 사용합니다.
movrit.channel-connect.login-enabled=${CHANNEL_CONNECT_LOGIN_ENABLED:false}
# 키가 비어 있는 서비스는 화면에 '준비 중'으로 보이고 연결을 시작하지 않습니다.
# 돌아올 주소: {redirect-base}/channel-connect/callback/{instagram|youtube|naver-blog} 를 각 개발자 앱에 등록합니다.
movrit.channel-connect.redirect-base=${CHANNEL_CONNECT_REDIRECT_BASE:${FRONTEND_BASE_URL:http://localhost:5173}}
movrit.channel-connect.instagram.client-id=${INSTAGRAM_CLIENT_ID:}
movrit.channel-connect.instagram.client-secret=${INSTAGRAM_CLIENT_SECRET:}
movrit.channel-connect.instagram.graph-version=${INSTAGRAM_GRAPH_VERSION:v26.0}
# 소개글 인증 코드 자동 확인(인스타그램 Business Discovery): 우리 서비스의 인스타그램 비즈니스 계정 ID와 접근 토큰. 비어 있으면 운영자 확인으로 넘깁니다.
movrit.channel-connect.instagram.discovery-account-id=${INSTAGRAM_DISCOVERY_ACCOUNT_ID:}
movrit.channel-connect.instagram.discovery-token=${INSTAGRAM_DISCOVERY_TOKEN:}
# 유튜브는 따로 지정하지 않으면 Google 로그인 키를 함께 씁니다(YouTube Data API v3 사용 설정 필요).
movrit.channel-connect.youtube.client-id=${YOUTUBE_CLIENT_ID:}
movrit.channel-connect.youtube.client-secret=${YOUTUBE_CLIENT_SECRET:}
movrit.channel-connect.naver.client-id=${NAVER_CLIENT_ID:}
movrit.channel-connect.naver.client-secret=${NAVER_CLIENT_SECRET:}

# Local image storage (development)
# 공개 이미지(캠페인·브랜드·상품) 위치입니다. /uploads 주소로 내려갑니다.
app.upload-dir=${UPLOAD_DIR:uploads}
# 비공개 파일(구매 인증·취소 증빙·채팅 첨부·채널 확인 자료·프로필 사진) 위치입니다. 공개 폴더와 겹치면 서버가 뜨지 않습니다.
# 기본값은 공개 폴더 옆의 "{공개 폴더}-private"이며, 이 폴더는 /uploads 주소로 연결되지 않아 권한 확인 API로만 내려갑니다.
app.private-upload-dir=${PRIVATE_UPLOAD_DIR:${app.upload-dir}-private}
# 채팅 영상 첨부(20MB)에 맞춘 상한입니다. 사진·캡처 등 다른 업로드는 각 저장소가 5MB로 따로 제한합니다.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# 예상 정산액에 사용하는 기본 플랫폼 수수료율
movrit.settlement.default-fee-rate=10

movrit.email.delivery=${EMAIL_DELIVERY:unconfigured}
movrit.email.from=${EMAIL_FROM:no-reply@movrit.local}
movrit.email.verification.expires-minutes=10
movrit.email.verification.resend-seconds=60
movrit.email.verification.hourly-limit=5
movrit.email.verification.max-attempts=5
# 휴대폰 인증번호: 발송 방식(unconfigured=503 안내, local-preview=통합 프로필 시연 전용), 유효 시간·재발송 간격·횟수 제한
movrit.phone.delivery=${PHONE_DELIVERY:unconfigured}
movrit.phone.verification.expires-minutes=5
movrit.phone.verification.resend-seconds=60
movrit.phone.verification.hourly-limit=5
movrit.phone.verification.number-daily-limit=10
movrit.phone.verification.max-attempts=5

# API 문서(Swagger UI: /swagger-ui.html). 공개 서버에서 숨기려면 API_DOCS_ENABLED=false로 실행합니다.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
# 분류를 이름순(공통 → 업체 → 운영자 → 이전 기능 → 참여자)으로 정렬하고, 넣은 토큰은 새로고침해도 유지합니다.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
