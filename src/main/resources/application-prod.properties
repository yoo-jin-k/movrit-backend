# 배포(운영) 환경 설정입니다. SPRING_PROFILES_ACTIVE=prod 로 실행하면 application.properties 위에 덮어씁니다.
# 비밀값은 여기에 적지 않고 모두 환경 변수로 받습니다(DB_PASSWORD, JWT_SECRET, 소셜 로그인 키 등).

# DB 주소도 환경 변수로 받습니다(로컬 기본 주소를 쓰지 않음).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}

# API를 부를 수 있는 프론트 주소: 실제 도메인을 반드시 지정합니다(기본값 없음, 비어 있으면 서버가 뜨지 않음).
movrit.security.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend-base-url=${FRONTEND_BASE_URL}

# API 문서(Swagger)는 기본으로 끕니다. 꼭 필요할 때만 API_DOCS_ENABLED=true 로 켭니다.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# SQL 문장을 로그에 남기지 않습니다(개인정보가 섞인 조회 조건이 로그에 남지 않게).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 오류 응답에 서버 내부 정보(예외 종류·스택)를 넣지 않습니다.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# HTTPS를 끝내 주는 프록시(배포 플랫폼) 뒤에서 실제 접속 주소·https 여부를 받습니다(로그인 실패 제한·HSTS에 필요).
server.forward-headers-strategy=framework
