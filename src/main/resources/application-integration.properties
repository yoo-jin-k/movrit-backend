# 통합 검수는 개발 DB와 분리된 복제 DB 및 별도 포트를 사용합니다.
spring.datasource.url=${INTEGRATION_DB_URL:jdbc:postgresql://localhost:5432/movrit_integration}
spring.datasource.username=${INTEGRATION_DB_USERNAME:movrit_user}
spring.datasource.password=${INTEGRATION_DB_PASSWORD:}
server.port=${INTEGRATION_SERVER_PORT:18080}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:18080/api/auth/google/callback}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5174}

# API의 LocalDateTime 값은 서울 시간 기준으로 생성하고 문자열에는 오프셋을 붙이지 않습니다.
spring.jackson.time-zone=Asia/Seoul
app.upload-dir=${INTEGRATION_UPLOAD_DIR:/private/tmp/movrit-integration-uploads}
