# 통합 검수는 개발 DB와 분리된 복제 DB 및 별도 포트를 사용합니다.
spring.datasource.url=${INTEGRATION_DB_URL:jdbc:postgresql://localhost:5432/movrit_integration}
spring.datasource.username=${INTEGRATION_DB_USERNAME:movrit_user}
spring.datasource.password=${INTEGRATION_DB_PASSWORD:}
server.port=${INTEGRATION_SERVER_PORT:18080}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:18080/api/auth/google/callback}
# 통합 환경(18080)에서는 Kakao 콜백도 같은 백엔드 포트로 받습니다.
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:18080/api/auth/kakao/callback}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5174}

# API의 LocalDateTime 값은 서울 시간 기준으로 생성하고 문자열에는 오프셋을 붙이지 않습니다.
spring.jackson.time-zone=Asia/Seoul
# 업로드 파일은 재부팅에도 남도록 사용자 홈 아래 고정 폴더에 저장합니다.
app.upload-dir=${INTEGRATION_UPLOAD_DIR:${user.home}/.movrit/integration-uploads}
# 로컬 통합 환경은 SMTP 없이 인증 코드를 화면에 보여주는 시연 모드를 씁니다. 실제 메일을 보내려면 EMAIL_DELIVERY=smtp 와 메일 계정을 설정합니다.
movrit.email.delivery=${EMAIL_DELIVERY:local-preview}
# 휴대폰 인증도 문자 발송 계약 없이 인증번호를 화면에 보여주는 시연 모드를 씁니다.
movrit.phone.delivery=${PHONE_DELIVERY:local-preview}

# 통합 시연 화면(5174)으로 SNS 채널 연결 후 돌아옵니다.
movrit.channel-connect.redirect-base=${CHANNEL_CONNECT_REDIRECT_BASE:${FRONTEND_BASE_URL:http://localhost:5174}}
