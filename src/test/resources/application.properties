spring.datasource.url=jdbc:h2:mem:movrit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never

jwt.secret=test-only-secret-key-that-is-longer-than-32-bytes
jwt.access-token-expiration=3600000
kakao.client-id=test-kakao-client-id
kakao.client-secret=test-kakao-client-secret
kakao.redirect-uri=http://localhost/test/kakao/callback
google.client-id=test-google-client-id
google.client-secret=test-google-client-secret
google.redirect-uri=http://localhost/test/google/callback
app.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=587
app.password-reset.expose-token=false
app.upload-dir=${java.io.tmpdir}/movrit-test-uploads
movrit.settlement.default-fee-rate=10
