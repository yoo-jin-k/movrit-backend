plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.2'
}

group = 'com.movrit'
version = '0.0.1-SNAPSHOT'
description = 'movrit'

java {
    toolchain {
        // 표준 빌드는 Java 17입니다. JDK 17이 없는 로컬 PC는 -PmovritJavaVersion=18 처럼 설치된 버전으로 빌드할 수 있습니다.
        languageVersion = JavaLanguageVersion.of((project.findProperty('movritJavaVersion') ?: '17') as int)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // DB 구조 변경을 버전 파일(src/main/resources/db/migration)로 관리합니다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 캠페인 WebP 디코딩과 EXIF 방향 확인에 사용합니다.
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        // Git에서 관리하지 않는 로컬 복사본은 정리 대상에서 제외합니다.
        targetExclude('**/* 2.java')
        googleJavaFormat('1.24.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
