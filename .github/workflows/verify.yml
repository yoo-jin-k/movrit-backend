name: Verify backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Compile backend
        run: ./gradlew clean compileJava --no-daemon
      - name: Test creator dashboard calculation
        run: ./gradlew test --tests com.movrit.movrit.creator.CreatorDtosTest --no-daemon
